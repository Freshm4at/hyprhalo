<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#20262f"/>
      <stop offset="1" stop-color="#10131a"/>
    </linearGradient>
    <linearGradient id="haloGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5d5d"/>
      <stop offset="0.25" stop-color="#ffb25d"/>
      <stop offset="0.5" stop-color="#5dffa6"/>
      <stop offset="0.75" stop-color="#5d8bff"/>
      <stop offset="1" stop-color="#c45dff"/>
    </linearGradient>
    <radialGradient id="coreGrad" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="0.8" stop-color="#ffffff" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="96" fill="url(#bgGrad)"/>

  <circle cx="256" cy="256" r="148" fill="url(#haloGrad)" opacity="0.45" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="148" fill="none" stroke="url(#haloGrad)" stroke-width="20" stroke-linecap="round"/>

  <rect x="156" y="181" width="200" height="150" rx="14" fill="url(#coreGrad)"/>
  <rect x="156" y="181" width="200" height="150" rx="14" fill="#2b3342" opacity="0.82" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>

  <rect x="156" y="299" width="200" height="6" rx="3" fill="#161b24"/>
</svg>