[package]
name = "hyprhalo"
version = "0.1.0"
edition = "2021"
description = "Ambilight for Hyprland: sync wallpaper and window glow with the edge colors of the active game window"
license = "MIT"
rust-version = "1.86"

[dependencies]
smithay-client-toolkit = "0.21"
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wayland-protocols = { version = "0.32", features = ["client"] }
calloop = "0.14"
memmap2 = "0.9"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
log = "0.4"
env_logger = "0.11"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3